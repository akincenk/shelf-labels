[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelf-labels"
version = "0.1.0"
description = "Turn a CSV of SKUs or shelf locations into Code 128 and QR labels as PDF sheets or Zebra ZPL."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Cenk Akin" }]
dependencies = ["reportlab>=4.2"]

[project.optional-dependencies]
# pypdfium2 + zxing-cpp let the tests rasterize the PDF and decode every barcode on it.
dev = ["pytest>=8", "ruff>=0.6", "pypdfium2>=4.30", "zxing-cpp>=2.2", "pillow>=10"]

[project.scripts]
shelf-labels = "shelf_labels.cli:main"

[tool.ruff]
line-length = 120
